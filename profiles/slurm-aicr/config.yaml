executor: slurm
software-deployment-method:
  - conda
conda-prefix: .conda

jobs: 40
max-jobs-per-second: 5
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:
  slurm_account: genomeatlas_umassmed
  slurm_partition: cpu
  runtime: 60m
  mem_mb: 4000

set-threads:
  macs3: 1
  bam2bw: 4
  negatives: 1
  fit: 4
  evaluate: 4

# Flat presets, no size/attempt scaling. Right-size once from benchmarks/<run_id>/;
# to catch stragglers, bump the preset and rerun (only the failed jobs re-run).
set-resources:
  macs3:
    mem_mb: 16000
    runtime: 240m
  bam2bw:
    mem_mb: 16000
    runtime: 480m
  negatives:
    mem_mb: 8000
    runtime: 60m
  count_fragments:
    mem_mb: 4000
    runtime: 240m
  fit:
    slurm_partition: b200-batch
    gres: gpu:1
    mem_mb: 20000
    runtime: 60m
  evaluate:
    slurm_partition: b200-batch
    gres: gpu:1
    mem_mb: 12000
    runtime: 30m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
