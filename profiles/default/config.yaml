# Local execution. Set fit.device/evaluate.device to cpu for a CPU-only box.
software-deployment-method:
  - conda
conda-prefix: .conda

cores: 16
printshellcmds: true
rerun-incomplete: true
keep-going: true
retries: 1

default-resources:
  mem_mb: 4000
  runtime: 120

set-threads:
  bam2bw: 4
  fit: 8
  evaluate: 8

set-resources:
  macs3:     {mem_mb: 8000}
  bam2bw:    {mem_mb: 8000}
  negatives: {mem_mb: 8000}
  fit:       {mem_mb: 48000}
  evaluate:  {mem_mb: 48000}
