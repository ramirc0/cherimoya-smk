# Rule envs, imported from the old conda env files with `pixi import`.
# pixi.lock holds the exact solve. Every pin lives in one feature, so envs
# that share a package cannot drift apart.
#   cherimoya      = cherimoya + pypi-shared + cuda13
#   cherimoya-sm70 = cherimoya + pypi-shared + cuda126 (V100, sm_70)
#   modisco-report = modisco-report + pypi-shared; MEME tomtom needs icu<76,
#                    which conflicts with cherimoya's conda pins.
[workspace]
name = "cherimoya-smk-envs"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

# certifi releases remove compromised CAs, so it is exempt from the cutoff.
[exclude-newer]
certifi = "0d"

[pypi-exclude-newer]
certifi = "0d"

