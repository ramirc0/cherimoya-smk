# Launcher: Snakemake with the pixi software-deployment plugin and the SLURM
# and local-gpu executor plugins. Rule envs live in their own workspace,
# workflow/envs/pixi.toml.
[workspace]
name = "cherimoya-smk"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

# certifi releases remove compromised CAs, so it is exempt from the cutoff.
[exclude-newer]
certifi = "0d"

[pypi-exclude-newer]
certifi = "0d"

[dependencies]
python = "3.13.*"
polars = "*"

[pypi-dependencies]
snakemake = { git = "https://github.com/snakemake/snakemake.git", rev = "86c31130239381055fea37fe0c369c6775cb75c3" }
snakemake-software-deployment-plugin-pixi = { git = "https://github.com/cademirch/snakemake-software-deployment-plugin-pixi.git", rev = "315e0f3113daefc2dfeda3a48777cd1acb2707e0" }
snakemake-executor-plugin-slurm = "==2.8.0"
snakemake-executor-plugin-slurm-jobstep = "==0.6.1"
snakemake-executor-plugin-local-gpu = { git = "https://github.com/ramirc0/snakemake-executor-plugin-local-gpu.git", rev = "374ac4dab8d2d995213c238a6ae9ef471cb65576" }

[feature.lint.dependencies]
ruff = ">=0.17.3,<0.18"
numpydoc = ">=1.11.0,<2"

[feature.lint.tasks]
lint = "ruff check && ruff format --check && numpydoc lint workflow/scripts/*.py"

[environments]
lint = { features = ["lint"], no-default-feature = true }
